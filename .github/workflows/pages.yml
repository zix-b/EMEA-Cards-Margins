name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calculator, ZIP validation, admin flow and publication
        run: |
          node tests/calculator.test.mjs
          node tests/import.test.mjs
          node tests/files.test.mjs
          node tests/github.test.mjs
          node tests/admin.test.mjs
          node tests/editor.test.mjs
          node tests/editor-ui.test.mjs
          node tests/cards.test.mjs
          node tests/cards-ui.test.mjs
          node tests/sheet-data.test.mjs
          node tests/regions.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
