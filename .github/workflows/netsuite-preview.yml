name: Preview NetSuite pricing
run-name: NetSuite preview ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      approve_public_preview:
        description: I approve publishing these NetSuite selling prices in the public repository and website
        required: true
        default: false
        type: boolean
      request_id:
        description: Preview request ID (letters, digits and hyphens)
        required: true
        default: manual
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main' && inputs.approve_public_preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate selling prices (read-only NetSuite access)
        env:
          NETSUITE_ACCOUNT_ID: ${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY: ${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET: ${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID: ${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET: ${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_REQUEST_ID: ${{ inputs.request_id }}
        run: python scripts/netsuite_preview.py
      - name: Save preview only (fail if main changed during retrieval)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netsuite-preview.json
          git commit -m 'Refresh NetSuite preview; keep active prices unchanged'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish preview to the existing site
        id: deployment
        uses: actions/deploy-pages@v4
