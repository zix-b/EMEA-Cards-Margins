name: Prepare verified NetSuite pricing snapshot
on:
  push:
    branches: [investigate/netsuite-readonly-20261005]
    paths: [.github/workflows/netsuite-readonly.yml, scripts/netsuite_sync.py, tests/netsuite_test.py]
permissions:
  contents: write
concurrency:
  group: netsuite-snapshot
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check cost preservation and range conversion
        run: python3 tests/netsuite_test.py
      - name: Read verified USD-per-Each selling prices
        env:
          NETSUITE_ACCOUNT_ID: ${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY: ${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET: ${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID: ${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET: ${{ secrets.NETSUITE_TOKEN_SECRET }}
        run: python3 scripts/netsuite_sync.py
      - name: Test updated calculator and all admin functions
        run: node --test tests/*.test.mjs
      - name: Save validated snapshot for production review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pricing-data.json pricing-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare verified NetSuite selling prices; retain existing costs and MAF'
          git push origin HEAD:investigate/netsuite-readonly-20261005
